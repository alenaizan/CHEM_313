# Master environment for every notebook in this repository.
# Verified to solve on linux-64, osx-64, osx-arm64 and win-64.
# Note: psi4 >= 1.11 requires macOS 11 or newer on both Intel and Apple silicon.
name: comp
channels:
    - conda-forge
dependencies:
    - python=3.12
    - psi4=1.11
    # psi4 1.11 pins the exact libint build it was compiled against, so the
    # manual libint pin that older psi4 releases needed is no longer required.
    - numpy=2.4
    - scipy=1.18
    - sympy=1.14
    # matplotlib-base is matplotlib without the Qt/PySide GUI backends. The
    # notebooks only use the inline and ipympl (widget) backends, and dropping
    # Qt saves a large download, especially on Windows.
    - matplotlib-base=3.11
    - nglview=4.0
    # ipympl + ipywidgets are required for `%matplotlib widget` interactive plots
    # under JupyterLab 4 / Notebook 7 (the stack mybinder.org now serves).
    - ipympl=0.10
    - ipywidgets=8.1
    - jupyterlab=4.6
    - notebook=7.6
    - mdtraj=1.11
    - openmm=8.6
    - openbabel=3.2
