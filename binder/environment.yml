# Master environment for every notebook in this repository.
# Verified to solve on linux-64, osx-64, osx-arm64 and win-64.
# Note: psi4 >= 1.11 requires macOS 11 or newer on both Intel and Apple silicon.
name: comp
channels:
    - conda-forge
dependencies:
    - python=3.12
    - psi4=1.11
    # psi4 1.11 pins the exact libint build it was compiled against, so the
    # manual libint pin that older psi4 releases needed is no longer required.
    - numpy=2.4
    - scipy=1.18
    - sympy=1.14
    # matplotlib-base is matplotlib without the Qt/PySide GUI backends. The
    # notebooks only use the inline and ipympl (widget) backends, and dropping
    # Qt saves a large download, especially on Windows.
    - matplotlib-base=3.11
    # nglview is held at 3.1.4. The 4.0.x releases ship a stale prebuilt
    # frontend that registers itself with the widget registry as
    # nglview-js-widgets 3.1.5 while the Python side asks for the semver
    # range "4.0". Nothing matches, so the widget manager fails with
    # "Failed to load model class 'NGLModel'" and no molecule renders.
    # Upstream's git tree is self-consistent; only the released sdist that
    # PyPI and conda-forge build from carries the stale bundle, so there is
    # no fixed 4.0.x to move up to. 3.1.4 matches its own frontend exactly.
    # Note that headless execution does NOT catch the 4.0.x breakage: it is
    # purely browser-side, so `nbconvert --execute` passes while the reader
    # sees nothing.
    - nglview=3.1.4
    # nglview 3.1.4 does `import pkg_resources` unconditionally at import
    # time, and setuptools dropped pkg_resources after 80.x. Without this
    # bound `import nglview` raises ModuleNotFoundError before any cell runs.
    - setuptools<81
    # ipympl + ipywidgets are required for `%matplotlib widget` interactive plots
    # under JupyterLab 4 / Notebook 7 (the stack mybinder.org now serves).
    - ipympl=0.10
    - ipywidgets=8.1
    # ipykernel must be pinned, not left to whatever the base image ships.
    # nglview issues every comm message from a background thread
    # (RemoteCallThread), and ipykernel tracks the parent message in a
    # ContextVar that has no value outside the main thread's context. Older
    # ipykernel calls `self._shell_parent.get()` directly, which raises
    # LookupError, so nglview's loadFile never leaves the kernel: the NGL
    # stage builds, reports loaded=True, and renders an empty viewer with
    # n_components == 0. ipykernel >= 7.3 wraps that lookup in
    # _get_shell_context_var, which falls back to the shell context and makes
    # sends from user-launched threads work again.
    - ipykernel=7.3
    - jupyterlab=4.6
    - notebook=7.6
    - mdtraj=1.11
    - openmm=8.6
    - openbabel=3.2
